[project]
name = "fruitsenseai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sairam208", email = "sairam2006soramesh@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "google-genai>=2.31.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "sarvamai>=0.1.37",
    "scikit-learn>=1.9.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[project.scripts]
fruitsenseai = "fruitsenseai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
